name: DevOps Learning Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        default: "1.0.2"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deployment started
        run: |
          echo "Deploying image tag: ${{ inputs.image_tag }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull "ghcr.io/${{ github.repository_owner }}/devops-learning:${{ inputs.image_tag }}"

      - name: Create Docker network
        run: docker network create devops-network

      - name: Start PostgreSQL container
        run: |
          docker run -d \
            --name db \
            --network devops-network \
            -e POSTGRES_DB=devopsdb \
            -e POSTGRES_USER=devops \
            -e POSTGRES_PASSWORD=devops_password \
            postgres:16

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec db pg_isready -U devops -d devopsdb; then
              echo "PostgreSQL is ready!"
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL failed to become ready."
          exit 1

      - name: Run Flask application
        run: |
          docker run -d \
            --name devops-learning-app \
            --network devops-network \
            -p 5000:5000 \
            -e APP_ENV=deployment \
            -e DB_HOST=db \
            -e DB_NAME=devopsdb \
            -e DB_USER=devops \
            -e DB_PASSWORD=devops_password \
            "ghcr.io/${{ github.repository_owner }}/devops-learning:${{ inputs.image_tag }}"

      - name: Check container status
        run: docker ps -a

      - name: Wait for application startup
        run: sleep 5

      - name: Verify application health
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:5000/health; then
              echo "Application is healthy!"
              exit 0
            fi

            echo "Waiting for application health..."
            sleep 3
          done

          echo "Application health check failed."
          exit 1

      - name: Inspect container state
        if: always()
        run: docker inspect devops-learning-app --format '{{json .State}}'

      - name: Show container logs
        if: always()
        run: docker logs devops-learning-app

      - name: Test application internally
        if: always()
        run: |
          docker exec devops-learning-app python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:5000/health').read().decode())" || true
