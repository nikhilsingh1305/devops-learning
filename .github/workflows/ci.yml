name: DevOps Learning CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate README
        run: test -f README.md

      - name: Validate workflow directory
        run: test -d .github/workflows