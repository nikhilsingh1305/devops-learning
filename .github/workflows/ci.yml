name: DevOps Learning CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest

      - name: Determine image tag
        if: github.event_name != 'pull_request'
        id: image_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        if: github.event_name != 'pull_request'
        run: docker build -t "ghcr.io/${{ github.repository_owner }}/devops-learning:${{ steps.image_tag.outputs.tag }}" .

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: docker push "ghcr.io/${{ github.repository_owner }}/devops-learning:${{ steps.image_tag.outputs.tag }}"

      - name: Tag image as latest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag "ghcr.io/${{ github.repository_owner }}/devops-learning:${{ steps.image_tag.outputs.tag }}" \
            "ghcr.io/${{ github.repository_owner }}/devops-learning:latest"
          docker push "ghcr.io/${{ github.repository_owner }}/devops-learning:latest"
